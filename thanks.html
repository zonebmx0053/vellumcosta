<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <script>
        // Tema antes de pintar la página (evita el destello en claro) y animaciones de scroll (animaciones.js).
        (function () {
            var root = document.documentElement;
            try {
                if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) root.classList.add('dark');
                else root.classList.remove('dark');
            } catch (e) { }
            root.classList.add('anim');
            // Si animaciones.js no llega a cargarse, el contenido no se queda escondido.
            setTimeout(function () { if (!window.vcAnim) root.classList.remove('anim'); }, 3000);
        })();
    </script>
    <title>Thank You! | Vellum Costa</title>
    
    <link rel="icon" type="image/png" href="LogoPestaña.png">
    
    <link rel="preload" href="fuentes/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fuentes/playfair-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="colores.css">
    <link rel="stylesheet" href="web.css">
    <link rel="stylesheet" href="tailwind.css">
</head>
<body class="bg-brand-bg dark:bg-brand-darkmode text-brand-dark dark:text-white font-sans antialiased h-screen flex items-center justify-center text-center px-6 transition-colors duration-500">
    
    <div class="max-w-lg" data-aos="zoom-in">
        <span class="text-brand-gold text-6xl mb-8 block leading-none" aria-hidden="true"><svg class="icon" viewBox="0 0 512 512" preserveAspectRatio="xMinYMid meet"><path d="M256 512A256 256 0 1 0 256 0a256 256 0 1 0 0 512zM369 209L241 337c-9.4 9.4-24.6 9.4-33.9 0l-64-64c-9.4-9.4-9.4-24.6 0-33.9s24.6-9.4 33.9 0l47 47L335 175c9.4-9.4 24.6-9.4 33.9 0s9.4 24.6 0 33.9z"/></svg></span>
        <h1 class="font-serif text-5xl mb-6">Thank You!</h1>
        <p class="text-lg font-light text-brand-dark/70 dark:text-white/70 mb-10 leading-relaxed">
            Your form has been successfully submitted.<br>
            We will get back to you as soon as possible.
        </p>
        <a href="home.html" class="inline-block bg-brand-gold text-brand-dark px-10 py-4 text-sm font-bold tracking-widest uppercase hover:bg-brand-dark hover:text-white dark:hover:bg-white dark:hover:text-brand-dark transition-all duration-300 rounded-md shadow-lg shadow-brand-gold/30">
            Back to website
        </a>
    </div>

    <script src="animaciones.js" defer></script>
</body>
</html>
