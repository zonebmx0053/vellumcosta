<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Sin esto, al entrar por /admin/ (con barra final) no se encuentran los estilos ni el script -->
    <base href="/">

    <title>Panel de alojamientos | Vellum Costa</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/png" href="LogoPestaña.png">
    <meta name="theme-color" content="#121212">

    <!-- El panel es oscuro por defecto; el tema claro se recuerda en este navegador -->
    <script>
        try { if (localStorage.getItem('vc-admin-theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) { }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- colores.css: los colores de la web; el tema oscuro del panel usa los mismos -->
    <link rel="stylesheet" href="colores.css">
    <!-- web.css: las fuentes, alojadas en la propia web -->
    <link rel="stylesheet" href="web.css">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div id="admin"><p class="ad-loading">Cargando el panel…</p></div>
    <noscript><p class="ad-loading">El panel necesita JavaScript para funcionar.</p></noscript>

    <!-- propiedades-data.js es el punto de partida la primera vez, antes de guardar nada en el panel -->
    <script src="propiedades-data.js" defer></script>
    <script src="catalogo.js" defer></script>
    <script src="precios.js" defer></script>
    <script src="admin.js" defer></script>
</body>
</html>
